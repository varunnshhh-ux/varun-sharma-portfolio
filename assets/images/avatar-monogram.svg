<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#080B10" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>
    <filter id="avGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="160" cy="160" r="140" fill="url(#haloGlow)" />
  
  <!-- Outer Tech Hexagon / Circle Frame -->
  <circle cx="160" cy="160" r="130" fill="url(#avatarBg)" stroke="url(#neonGlow)" stroke-width="2" stroke-opacity="0.6" />
  <circle cx="160" cy="160" r="118" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="6 6" />

  <!-- Orbiting Node Dots -->
  <circle cx="160" cy="30" r="4" fill="#00F2FE" filter="url(#avGlow)" />
  <circle cx="280" cy="210" r="3.5" fill="#818CF8" />
  <circle cx="50" cy="200" r="3" fill="#38BDF8" />

  <!-- Geometric Tech Monogram [ VS ] -->
  <g filter="url(#avGlow)" transform="translate(160, 160)">
    <!-- Letter V -->
    <path d="M -60 -45 L -25 45 L -10 45 L -45 -45 Z" fill="url(#neonGlow)" />
    
    <!-- Letter S -->
    <path d="M 45 -25 C 40 -40 25 -45 5 -45 C -15 -45 -30 -35 -30 -15 C -30 15 15 15 15 30 C 15 38 5 45 -10 45 C -30 45 -45 35 -50 20 L -35 15 C -30 25 -20 30 -10 30 C 5 30 15 25 15 15 C 15 -10 -30 -10 -30 -30 C -30 -42 -15 -55 5 -55 C 25 -55 45 -42 50 -25 Z" 
          fill="#FFFFFF" fill-opacity="0.95" />
  </g>

  <!-- Status / Code Tag Badge at bottom -->
  <g transform="translate(160, 260)">
    <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#0A0F1D" stroke="#00F2FE" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="-48" cy="0" r="3" fill="#10B981" />
    <text x="5" y="4" text-anchor="middle" font-family="'JetBrains Mono', monospace, sans-serif" font-size="9" font-weight="700" fill="#94A3B8" letter-spacing="1.5">AI • DS • SWE</text>
  </g>
</svg>
