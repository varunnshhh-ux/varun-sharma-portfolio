<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="hwBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="handGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="360" fill="url(#hwBg)" />

  <!-- Background Sensor Array Matrix -->
  <g opacity="0.15" stroke="#38BDF8" stroke-width="0.5">
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="500" y1="0" x2="500" y2="360" />
    <line x1="0" y1="90" x2="600" y2="90" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="270" x2="600" y2="270" />
  </g>

  <!-- Waveform Dynamic Frequency Curves -->
  <path d="M 50 180 Q 120 80, 200 180 T 350 180 T 480 180 T 550 180" fill="none" stroke="#06B6D4" stroke-width="2" stroke-opacity="0.4" />
  <path d="M 50 180 Q 150 260, 250 180 T 400 180 T 550 180" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-opacity="0.4" />
  
  <!-- Stylized Hand Pose / Gesture Skeleton -->
  <g transform="translate(300, 160)" filter="url(#handGlow)">
    <!-- Wrist & Palm Joint -->
    <circle cx="0" cy="70" r="8" fill="#3B82F6" />
    <circle cx="-30" cy="20" r="6" fill="#06B6D4" />
    <circle cx="-10" cy="10" r="6" fill="#06B6D4" />
    <circle cx="15" cy="10" r="6" fill="#06B6D4" />
    <circle cx="35" cy="25" r="6" fill="#06B6D4" />
    <circle cx="-55" cy="45" r="6" fill="#38BDF8" /> <!-- Thumb base -->

    <!-- Finger Bones -->
    <!-- Thumb -->
    <line x1="0" y1="70" x2="-35" y2="55" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
    <line x1="-35" y1="55" x2="-65" y2="35" stroke="#06B6D4" stroke-width="3" stroke-linecap="round" />
    <circle cx="-65" cy="35" r="6" fill="#00F2FE" />

    <!-- Index -->
    <line x1="0" y1="70" x2="-30" y2="20" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
    <line x1="-30" y1="20" x2="-35" y2="-40" stroke="#00F2FE" stroke-width="3" stroke-linecap="round" />
    <line x1="-35" y1="-40" x2="-38" y2="-75" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" />
    <circle cx="-38" cy="-75" r="7" fill="#00F2FE" />

    <!-- Middle -->
    <line x1="0" y1="70" x2="-10" y2="10" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
    <line x1="-10" y1="10" x2="-10" y2="-55" stroke="#00F2FE" stroke-width="3" stroke-linecap="round" />
    <line x1="-10" y1="-55" x2="-10" y2="-95" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" />
    <circle cx="-10" cy="-95" r="7" fill="#00F2FE" />

    <!-- Ring -->
    <line x1="0" y1="70" x2="15" y2="10" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="10" x2="18" y2="-45" stroke="#00F2FE" stroke-width="3" stroke-linecap="round" />
    <line x1="18" y1="-45" x2="20" y2="-80" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" />
    <circle cx="20" cy="-80" r="7" fill="#00F2FE" />

    <!-- Pinky -->
    <line x1="0" y1="70" x2="35" y2="25" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
    <line x1="35" y1="25" x2="45" y2="-20" stroke="#00F2FE" stroke-width="3" stroke-linecap="round" />
    <line x1="45" y1="-20" x2="52" y2="-55" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" />
    <circle cx="52" cy="-55" r="6" fill="#00F2FE" />
  </g>

  <!-- Interactive Ripple Rings -->
  <circle cx="290" cy="65" r="30" fill="none" stroke="#00F2FE" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="3 3" />
  <circle cx="290" cy="65" r="50" fill="none" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3" />

  <!-- Card Info Overlay -->
  <g transform="translate(30, 275)">
    <rect width="220" height="58" rx="10" fill="#0A0F1D" fill-opacity="0.85" stroke="#1E293B" stroke-width="1" />
    <circle cx="20" cy="29" r="6" fill="#06B6D4" />
    <text x="36" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#38BDF8" letter-spacing="1">GESTURE INTERACTION</text>
    <text x="36" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">Handwave • Prototype</text>
  </g>
</svg>
