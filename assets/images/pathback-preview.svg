<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="routeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.7" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="360" fill="url(#bgGrad)" />
  <rect width="600" height="360" fill="url(#gridPattern)" />

  <!-- Radar / Ambient Rings -->
  <circle cx="300" cy="180" r="140" fill="none" stroke="#38BDF8" stroke-opacity="0.08" stroke-width="1" />
  <circle cx="300" cy="180" r="90" fill="none" stroke="#6366F1" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="4 4" />
  <circle cx="300" cy="180" r="40" fill="none" stroke="#00F2FE" stroke-opacity="0.15" stroke-width="1" />

  <!-- Map Topo Curves -->
  <path d="M 50 80 Q 150 140 300 100 T 550 120" fill="none" stroke="#1E293B" stroke-width="1" stroke-opacity="0.6" />
  <path d="M 30 260 Q 200 200 380 280 T 580 220" fill="none" stroke="#1E293B" stroke-width="1" stroke-opacity="0.6" />

  <!-- Active Route Path with Glow -->
  <path d="M 120 280 C 160 220, 180 250, 240 180 S 340 210, 390 130 S 450 150, 490 90" 
        fill="none" stroke="url(#routeGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <path d="M 120 280 C 160 220, 180 250, 240 180 S 340 210, 390 130 S 450 150, 490 90" 
        fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Waypoints & Markers -->
  <!-- Start Point (Origin) -->
  <circle cx="120" cy="280" r="14" fill="#00F2FE" fill-opacity="0.2" />
  <circle cx="120" cy="280" r="7" fill="#00F2FE" />
  <circle cx="120" cy="280" r="3" fill="#FFFFFF" />

  <!-- Intermediate Breadcrumbs -->
  <circle cx="240" cy="180" r="4" fill="#38BDF8" />
  <circle cx="390" cy="130" r="4" fill="#818CF8" />

  <!-- Current Destination Pin -->
  <g transform="translate(490, 90)">
    <circle cx="0" cy="0" r="18" fill="#6366F1" fill-opacity="0.25" filter="url(#glow)" />
    <circle cx="0" cy="0" r="9" fill="#6366F1" />
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
  </g>

  <!-- GPS Card Overlay (Glassmorphism look) -->
  <g transform="translate(30, 25)">
    <rect width="180" height="58" rx="10" fill="#0D1526" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
    <circle cx="20" cy="29" r="6" fill="#10B981" />
    <text x="36" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1">GPS NAVIGATION</text>
    <text x="36" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">PathBack v1.0 • Live</text>
  </g>

  <!-- Metrics HUD Badge -->
  <g transform="translate(430, 275)">
    <rect width="140" height="58" rx="10" fill="#0D1526" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
    <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94A3B8" letter-spacing="0.5">TRACKED DISTANCE</text>
    <text x="16" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#38BDF8">3.42 km</text>
  </g>
</svg>
