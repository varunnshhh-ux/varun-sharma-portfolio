<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <radialGradient id="spaceDeep" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1E1035" />
      <stop offset="40%" stop-color="#0F0D22" />
      <stop offset="100%" stop-color="#070712" />
    </radialGradient>
    <radialGradient id="blackholeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="65%" stop-color="#000000" />
      <stop offset="78%" stop-color="#F59E0B" />
      <stop offset="90%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="planetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="celestialGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Cosmos Background -->
  <rect width="600" height="360" fill="url(#spaceDeep)" />

  <!-- Distant Starfield -->
  <g fill="#FFFFFF" opacity="0.6">
    <circle cx="45" cy="40" r="1" />
    <circle cx="95" cy="120" r="1.5" opacity="0.8" />
    <circle cx="150" cy="50" r="0.8" />
    <circle cx="210" cy="90" r="1.2" />
    <circle cx="280" cy="40" r="1.5" />
    <circle cx="360" cy="65" r="0.8" />
    <circle cx="420" cy="30" r="1.2" />
    <circle cx="510" cy="70" r="1.8" opacity="0.9" />
    <circle cx="560" cy="110" r="1" />
    <circle cx="70" cy="220" r="1.2" />
    <circle cx="130" cy="310" r="1" />
    <circle cx="230" cy="290" r="1.5" />
    <circle cx="380" cy="320" r="0.8" />
    <circle cx="490" cy="290" r="1.4" />
    <circle cx="540" cy="240" r="1" />
  </g>

  <!-- Glowing Accretion Disk / Singularity -->
  <g transform="translate(300, 180)">
    <!-- Outer Glow -->
    <ellipse cx="0" cy="0" rx="160" ry="48" fill="none" stroke="#EC4899" stroke-width="2" stroke-opacity="0.3" filter="url(#celestialGlow)" />
    <!-- Warped Light Ring -->
    <ellipse cx="0" cy="0" rx="130" ry="38" fill="none" stroke="#F59E0B" stroke-width="3" stroke-opacity="0.8" filter="url(#celestialGlow)" transform="rotate(-12)" />
    <!-- Event Horizon Sphere -->
    <circle cx="0" cy="0" r="52" fill="#030308" />
    <circle cx="0" cy="0" r="54" fill="none" stroke="#F43F5E" stroke-width="2.5" opacity="0.85" filter="url(#celestialGlow)" />
    <!-- Front Accretion Swirl -->
    <path d="M -130 15 Q 0 45 130 -15" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" filter="url(#celestialGlow)" />
  </g>

  <!-- Gas Giant Planet Orbiting -->
  <g transform="translate(110, 110)">
    <circle cx="0" cy="0" r="32" fill="url(#planetGrad)" />
    <ellipse cx="0" cy="0" rx="46" ry="12" fill="none" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.7" transform="rotate(25)" />
    <circle cx="0" cy="0" r="32" fill="none" stroke="#60A5FA" stroke-width="1" stroke-opacity="0.4" />
  </g>

  <!-- Educational HUD Overlay -->
  <g transform="translate(30, 275)">
    <rect width="210" height="58" rx="10" fill="#0B0E1B" fill-opacity="0.85" stroke="#2E1065" stroke-width="1" />
    <circle cx="20" cy="29" r="6" fill="#8B5CF6" />
    <text x="36" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#C084FC" letter-spacing="1">INTERACTIVE COSMOS</text>
    <text x="36" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">Space Explorer • Educational</text>
  </g>
</svg>
